name: Sync all dividend instruments (FMP + EODHD)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: dividend-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync FMP calendar
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/sync_all_fmp.py
      - name: Sync mapped international stocks from EODHD
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python scripts/sync_eodhd.py
      - name: Commit calendar and reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json dividend-events.json sync-report.json eodhd-sync-report.json eodhd-sync-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync multiple dividend events from FMP and EODHD"
            git push
          else
            echo "No changes to commit"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-dividend-sync-report
          path: |
            sync-report.json
            eodhd-sync-report.json
          if-no-files-found: ignore
