name: Compare FMP Dividends (safe mode)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare FMP events without changing calendar
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/update_dividends.py
      - name: Save comparison report
        uses: actions/upload-artifact@v4
        with:
          name: fmp-comparison
          path: fmp_comparison.json
          retention-days: 14
